name: Deploy to VPS

on:
  push:
    branches:
      - claude/telegram-bot-calendar-sync-qi2012
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy bot files to VPS (no git on the server)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "bot/,main.py,Dockerfile,docker-compose.yml,requirements.txt,setup_google_auth.py"
          target: "/root/nova-g"
          strip_components: 0
          overwrite: true

      - name: Build and restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/nova-g
            rm -rf .git .github
            cat > xray-config.json << 'XRAYEOF'
            ${{ secrets.XRAY_CONFIG_JSON }}
            XRAYEOF
            cat > credentials.json << 'CREDEOF'
            ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
            CREDEOF
            cat > token.json << 'TOKENEOF'
            ${{ secrets.GOOGLE_TOKEN_JSON }}
            TOKENEOF
            cat > .env << 'ENVEOF'
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TIMEZONE=Europe/Moscow
            ALLOWED_USER_ID=
            TELEGRAM_PROXY_URL=socks5://127.0.0.1:1080
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            ENVEOF
            docker compose up -d --build
            sleep 20
            echo "===== curl api.telegram.org via SOCKS5 proxy ====="
            curl -sS --max-time 15 -x socks5h://127.0.0.1:1080 -o /dev/null -w "HTTP %{http_code}, time %{time_total}s\n" https://api.telegram.org || echo "curl via proxy failed"
            echo "===== docker compose logs xray (last 40 lines) ====="
            docker compose logs --tail=40 xray
            echo "===== docker compose logs bot (last 80 lines) ====="
            docker compose logs --tail=80 bot
            echo "===== docker ps ====="
            docker ps -a
