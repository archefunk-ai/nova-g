name: Deploy to VPS

on:
  push:
    branches:
      - claude/telegram-bot-calendar-sync-qi2012

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/nova-g
            git pull
            cat > xray-config.json << 'XRAYEOF'
            ${{ secrets.XRAY_CONFIG_JSON }}
            XRAYEOF
            grep -q '^TELEGRAM_PROXY_URL=' .env && sed -i 's#^TELEGRAM_PROXY_URL=.*#TELEGRAM_PROXY_URL=socks5://127.0.0.1:1080#' .env || echo 'TELEGRAM_PROXY_URL=socks5://127.0.0.1:1080' >> .env
            sed -i 's#^TELEGRAM_BOT_TOKEN=.*#TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}#' .env
            docker compose up -d --build
            sleep 20
            echo "===== curl api.telegram.org via SOCKS5 proxy ====="
            curl -sS --max-time 15 -x socks5h://127.0.0.1:1080 -o /dev/null -w "HTTP %{http_code}, time %{time_total}s\n" https://api.telegram.org || echo "curl via proxy failed"
            echo "===== docker compose logs xray (last 40 lines) ====="
            docker compose logs --tail=40 xray
            echo "===== docker compose logs bot (last 80 lines) ====="
            docker compose logs --tail=80 bot
            echo "===== docker ps ====="
            docker ps -a
