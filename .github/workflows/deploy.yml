name: Deploy to VPS

on:
  push:
    branches:
      - claude/telegram-bot-calendar-sync-qi2012

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/nova-g
            git pull
            docker compose up -d --build
            sleep 20
            echo "===== curl api.telegram.org from host ====="
            curl -sS --max-time 15 -o /dev/null -w "HTTP %{http_code}, time %{time_total}s\n" https://api.telegram.org || echo "curl failed"
            echo "===== docker compose logs (last 80 lines) ====="
            docker compose logs --tail=80 bot
            echo "===== docker ps ====="
            docker ps -a
