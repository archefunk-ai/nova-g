name: Deploy to VPS

on:
  push:
    branches:
      - claude/telegram-bot-calendar-sync-qi2012

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/nova-g
            git pull
            docker compose up -d --build
