name: Read VPS logs

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch logs via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/nova-g
            echo "===== docker ps ====="
            docker ps -a
            echo "===== docker compose logs bot (last 200 lines) ====="
            docker compose logs --tail=200 bot
