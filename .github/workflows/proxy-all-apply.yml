name: Route ALL VPS traffic through proxy (apply)

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      _MASK_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      _MASK_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      _MASK_GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
    steps:
      - name: Apply transparent proxy with 3-minute auto-revert
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            apt-get update -y
            apt-get install -y redsocks at
            systemctl enable --now atd
            cat > /etc/redsocks.conf << 'EOF'
            base {
              log_debug = off;
              log_info = on;
              log = "syslog:daemon";
              daemon = on;
              redirector = iptables;
            }
            redsocks {
              local_ip = 127.0.0.1;
              local_port = 12345;
              ip = 127.0.0.1;
              port = 1080;
              type = socks5;
            }
            EOF
            systemctl restart redsocks
            sleep 2
            cat > /root/revert-proxy-all.sh << 'EOF'
            #!/bin/bash
            iptables -t nat -D OUTPUT -p tcp -m conntrack --ctstate NEW -j REDSOCKS 2>/dev/null
            iptables -t nat -F REDSOCKS 2>/dev/null
            iptables -t nat -X REDSOCKS 2>/dev/null
            echo "$(date): reverted" >> /root/revert-proxy-all.log
            EOF
            chmod +x /root/revert-proxy-all.sh
            for j in $(atq | awk '{print $1}'); do atrm "$j"; done
            echo "/root/revert-proxy-all.sh" | at now + 3 minutes
            iptables -t nat -N REDSOCKS 2>/dev/null || true
            iptables -t nat -F REDSOCKS
            iptables -t nat -A REDSOCKS -d 127.0.0.0/8 -j RETURN
            iptables -t nat -A REDSOCKS -d 10.0.0.0/8 -j RETURN
            iptables -t nat -A REDSOCKS -d 172.16.0.0/12 -j RETURN
            iptables -t nat -A REDSOCKS -d 192.168.0.0/16 -j RETURN
            iptables -t nat -A REDSOCKS -d 169.254.0.0/16 -j RETURN
            iptables -t nat -A REDSOCKS -d 2.26.135.231 -j RETURN
            iptables -t nat -A REDSOCKS -p tcp -j REDIRECT --to-ports 12345
            iptables -t nat -D OUTPUT -p tcp -m conntrack --ctstate NEW -j REDSOCKS 2>/dev/null || true
            iptables -t nat -A OUTPUT -p tcp -m conntrack --ctstate NEW -j REDSOCKS
            echo "===== Применено. Авто-откат через 3 минуты, если не подтвердить. ====="
            sleep 3
            curl -sS --max-time 10 -o /dev/null -w "Проверка через новый маршрут: HTTP %{http_code}\n" https://ifconfig.me || echo "curl-проверка не прошла (не обязательно критично)"
            echo "Эта команда SSH выполнилась успешно ПОСЛЕ применения правил — хороший знак."
